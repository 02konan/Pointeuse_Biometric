<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#16204a" />
<meta name="description" content="BiometricWeb — supervision des pointages biométriques" />
<title>{% block title %}BiometricWeb — Pointage biométrique{% endblock %}</title>
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/icons8-fingerprint-50.ico') }}" />

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />

<script>
  // Applique le thème mémorisé avant le rendu pour éviter tout clignotement.
  (function () {
    try {
      var theme = localStorage.getItem("bw-theme");
      if (theme === "dark" || theme === "light") {
        document.documentElement.setAttribute("data-bs-theme", theme);
      }
    } catch (e) {}
  })();
</script>

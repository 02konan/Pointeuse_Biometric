<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Socle applicatif (sidebar, thème, toasts, filtres, pagination) -->
<script src="{{ url_for('static', filename='script.js') }}"></script>
<script src="{{ url_for('static', filename='pagination.js') }}"></script>

{% if active_page == 'rapports' %}
  <script src="{{ url_for('static', filename='rapport.js') }}"></script>
{% endif %}

{% if active_page == 'pointage' %}
  <script src="{{ url_for('static', filename='historique.js') }}"></script>
{% endif %}

{% if active_page == 'index' %}
  {% if (session['role'] or '')|lower == 'superadmin' %}
    <script src="{{ url_for('static', filename='dashboardAdmin.js') }}"></script>
  {% else %}
    <script src="{{ url_for('static', filename='dasboard.js') }}"></script>
  {% endif %}
{% endif %}

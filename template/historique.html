{% extends 'index.html' %} {% block content %}
<div id="attendance-content" class="content-section">
  <div class="container-fluid p-4">
    <h2
      class="mb-4 text-center p-3 bg-primary text-white rounded shadow-sm w-100"
    >
      Historique Des Pointages
    </h2>
    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label">Recherche:</label>
            <input
              id="champrecherche"
              type="text"
              class="form-control"
              placeholder="Rechercher un employé..."
            />
          </div>
          <div class="col-md-4">
           <label class="form-label">Section:</label>
            <select class="form-select" id="section">
              <option value="toutes" selected>Toutes les section</option>
              {% for section in sections %}
              <option value="{{ section.Nom }}">{{ section.Nom }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
    </div>
        </div>
      </div>
    </div>
    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Date de début</label>
            <input type="date" class="form-control" id="date-debut" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Date de fin</label>
            <input type="date" class="form-control" id="date-fin" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Statut</label>
            <select class="form-select" id="statut">
              <option value="tous" selected>Tous les statuts</option>
              <option value="Arrivée enregistrée">Arrivée enregistrée</option>
              <option value="Départ enregistré">Départ enregistré</option>
            </select>
          </div>
        </div>
      </div>
    </div>
<div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover" id="Table">
            <thead>
            <tr>
                <th>Nom</th>
                <th>Date</th>
                <th>Heure</th>
                <th>Statut</th>
                <th>Section</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="dashboard_recent_activity_list">
            {% for activite in historique %}
            <tr>
                <td>{{ activite.nom }}</td>
                <td class="">{{ activite.date_pointage}}</td>
                <td>{{activite.heure_pointage}}</td>
                <td class="text-{{ 'success'if activite.status=='Arrivée enregistrée' else 'danger' }}">{{ activite.status }}</td>
                <td class="text-primary">{{ activite.section }}</td>
                <td>
                    <a href="/employe/{{ activite.employe_id }}" class="btn btn-sm btn-info text-white">Voire<span><i class="fa fa-arrow-right-short"></i></span></a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
          </table>
        </div>
      </div>
    </div>
</div>
  </div>
</div>
{%endblock%}

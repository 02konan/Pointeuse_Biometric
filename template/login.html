{%include "header.html"%}
<div id="login-page" class="container-fluid">
  <div class="toast-container p-3 position-fixed top-0 end-0" style="z-index: 1100;">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="toast align-items-center text-bg-{{ 'success' if category == 'success' else 'danger' }} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="d-flex">
            <div class="toast-body">
              {{ message }}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
        </div>
      {% endfor %}
    {% endwith %}
  </div>
  <div class="row vh-100 justify-content-center align-items-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <i class="fas fa-fingerprint primary-color fa-4x mb-3"></i>
            <h2 class="fw-bold">Système de Pointage</h2>
            <p class="text-muted">Connectez-vous pour accéder au système</p>
          </div>
          <form id="adminForm" action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
              <label for="username" class="form-label">Nom d'utilisateur</label>
              <input
                type="text"
                class="form-control"
                name="username"
                required
              />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Mot de passe</label>
              <input
                type="password"
                class="form-control"
                name="password"
                required
              />
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" name="remember" />
              <label class="form-check-label" for="remember"
                >Se souvenir de moi</label
              >
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
              Connexion
            </button>
          </form>
          <form id="profForm" style="display: none;" action="{{ url_for('login_prof') }}" method="POST">
            <!-- <div class="mb-3">
              <label for="username1" class="form-label">Nom d'utilisateur</label>
              <input
                type="text"
                class="form-control"
                name="username1"
                required
              />
            </div> -->
            <div class="mb-3">
              <label for="code" class="form-label">Code utilisateur</label>
              <input
                type="password"
                class="form-control"
                name="code"
                required
              />
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" name="remember" />
              <label class="form-check-label" for="remember"
                >Se souvenir de moi</label
              >
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
              Connexion
            </button>
          </form>
          <a class="underline color-danger" id="prof" href="">Compte Professeur</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Active tous les toasts automatiquement
  document.addEventListener("DOMContentLoaded", function() {
    const toastElList = [].slice.call(document.querySelectorAll('.toast'))
    toastElList.forEach(function (toastEl) {
      const toast = new bootstrap.Toast(toastEl)
      toast.show()
    })
    const adminForm = document.getElementById("adminForm");
    const profForm = document.getElementById("profForm");
    const profLink = document.getElementById("prof");

    profLink.addEventListener("click", function (e) {
      e.preventDefault();

      if (adminForm.style.display !== "none") {
        adminForm.style.display = "none";
        profForm.style.display = "block";
        profLink.textContent = "Compte Administrateur";
      } else {
        adminForm.style.display = "block";
        profForm.style.display = "none";
        profLink.textContent = "Compte Professeur";
      }
    });
  });
</script>
